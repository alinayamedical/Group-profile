<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="620" height="140">
  <title>Alinaya Alrafia Medical Company</title>
  <defs>
    <style>
      .en-head { font-family:'Raleway','Arial',sans-serif; font-weight:700; }
      .en-sub  { font-family:'Raleway','Arial',sans-serif; font-weight:500; }
      .ar-name { font-family:'Cairo','Arial',sans-serif;   font-weight:600; }
    </style>
  </defs>

  <!-- Abstract Wedge mark -->
  <path d="M10,70 L70,8 L70,70 Z" fill="#1B4D3E"/>
  <path d="M130,70 L70,8 L70,70 Z" fill="#1B4D3E" opacity="0.62"/>
  <path d="M10,70 L70,132 L130,70 L70,70 Z" fill="#C9A84C"/>
  <!-- Center vertical line at apex -->
  <line x1="70" y1="8" x2="70" y2="70" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.45"/>


  <!-- Wordmark -->
  <text x="152" y="48" class="en-head" font-size="28" fill="#1B4D3E" letter-spacing="1.5">ALINAYA ALRAFIA</text>
  <rect x="152" y="58" width="448" height="2" fill="#C9A84C"/>
  <text x="152" y="76" class="en-sub" font-size="11" fill="#6B7280" letter-spacing="6">MEDICAL COMPANY</text>
  <line x1="152" y1="92" x2="600" y2="92" stroke="#E5E7EB" stroke-width="1"/>
  <text x="600" y="114" class="ar-name" font-size="18" fill="#1B4D3E" text-anchor="start" direction="rtl">شركة العناية الرفيعة الطبية</text>

</svg>
