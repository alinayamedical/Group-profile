<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="620" height="140">
  <title>Alinaya Alrafia Medical Company (White Monochrome)</title>
  <defs>
    <style>
      .en-head { font-family:'Raleway','Arial',sans-serif; font-weight:700; }
      .en-sub  { font-family:'Raleway','Arial',sans-serif; font-weight:500; }
      .ar-name { font-family:'Cairo','Arial',sans-serif;   font-weight:600; }
    </style>
  </defs>

  <!-- Abstract Wedge mark — monochrome white -->
  <path d="M10,70 L70,8 L70,70 Z" fill="#FFFFFF"/>
  <path d="M130,70 L70,8 L70,70 Z" fill="#FFFFFF" opacity="0.62"/>
  <path d="M10,70 L70,132 L130,70 L70,70 Z" fill="#FFFFFF"/>

  <!-- Wordmark — monochrome white -->
  <text x="152" y="48" class="en-head" font-size="28" fill="#FFFFFF" letter-spacing="1.5">ALINAYA ALRAFIA</text>
  <rect x="152" y="58" width="448" height="2" fill="#FFFFFF" opacity="0.4"/>
  <text x="152" y="76" class="en-sub" font-size="11" fill="#FFFFFF" opacity="0.55" letter-spacing="6">MEDICAL COMPANY</text>
  <line x1="152" y1="92" x2="600" y2="92" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
  <text x="600" y="114" class="ar-name" font-size="18" fill="#FFFFFF" opacity="0.75" text-anchor="start" direction="rtl">شركة العناية الرفيعة الطبية</text>

</svg>
