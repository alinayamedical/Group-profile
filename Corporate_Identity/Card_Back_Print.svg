<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 89 58" width="89mm" height="58mm">
  <title>Alinaya Alrafia — Business Card Back (Print)</title>
  <desc>89×58mm including 2mm bleed. Trim to 85×54mm. Safe zone 4mm from edges.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400&amp;family=Cairo:wght@600&amp;display=swap');
    </style>
  </defs>

  <!-- ── BACKGROUND (fills bleed) ── -->
  <rect width="89" height="58" fill="#FFFFFF"/>

  <!-- ── FULL COLOR WORDMARK — centred, 66mm wide ── -->
  <!-- viewBox 620×140, scale to 66mm: factor = 66/620 = 0.10645 -->
  <!-- Height: 140 × 0.10645 = 14.9mm -->
  <!-- Center x: (89-66)/2 = 11.5mm; center y: (58-14.9)/2 = 21.6mm -->
  <g transform="translate(11.5, 21.6) scale(0.10645)">
    <!-- Mark -->
    <path d="M10,70 L70,8 L70,70 Z" fill="#1B4D3E"/>
    <path d="M130,70 L70,8 L70,70 Z" fill="#1B4D3E" opacity="0.62"/>
    <path d="M10,70 L70,132 L130,70 L70,70 Z" fill="#C9A84C"/>
    <!-- Wordmark -->
    <text x="152" y="48"
      font-family="Raleway,Arial,sans-serif"
      font-weight="700"
      font-size="28"
      fill="#1B4D3E"
      letter-spacing="1.5">ALINAYA ALRAFIA</text>
    <rect x="152" y="58" width="448" height="2" fill="#C9A84C"/>
    <text x="152" y="76"
      font-family="Raleway,Arial,sans-serif"
      font-weight="500"
      font-size="11"
      fill="#6B7280"
      letter-spacing="6">MEDICAL COMPANY</text>
    <line x1="152" y1="92" x2="600" y2="92" stroke="#E5E7EB" stroke-width="1"/>
    <text x="600" y="114"
      font-family="Cairo,Arial,sans-serif"
      font-weight="600"
      font-size="18"
      fill="#1B4D3E"
      text-anchor="start"
      direction="rtl">شركة العناية الرفيعة الطبية</text>
  </g>

  <!-- ── GOLD DIVIDER — centered, 70% width = 62.3mm ── -->
  <!-- x: (89-62.3)/2 = 13.35 -->
  <rect x="13.35" y="39.3" width="62.3" height="0.3" fill="#C9A84C" opacity="0.38"/>

  <!-- ── CONTACT — centered, 5pt = 1.76mm, line-height ~2.8mm ── -->
  <text x="44.5" y="42.5"
    font-family="Raleway,Arial,sans-serif"
    font-weight="400"
    font-size="1.76"
    fill="#6B7280"
    text-anchor="middle">Riyadh, Kingdom of Saudi Arabia</text>

  <text x="44.5" y="45.8"
    font-family="Raleway,Arial,sans-serif"
    font-weight="400"
    font-size="1.76"
    fill="#6B7280"
    text-anchor="middle">info@alinayamedical.com  ·  alinayamedical.com</text>

</svg>
