<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 89 58" width="89mm" height="58mm">
  <title>Alinaya Alrafia — Business Card Front (Print)</title>
  <desc>89×58mm including 2mm bleed. Trim to 85×54mm. Safe zone 4mm from edges.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&amp;family=Cairo:wght@600&amp;display=swap');
    </style>
    <radialGradient id="glow-br" cx="100%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#C9A84C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── BACKGROUND (fills bleed) ── -->
  <rect width="89" height="58" fill="#1B4D3E"/>
  <rect width="89" height="58" fill="url(#glow-br)"/>
  <rect width="89" height="58" fill="url(#glow-tl)"/>

  <!-- ── LOGO MARK — white reversed, 16×16mm at (5,5) ── -->
  <!-- mark coords: 140×140 → scale factor 16/140 = 0.11429 -->
  <g transform="translate(5,5) scale(0.11429)">
    <path d="M10,70 L70,8 L70,70 Z" fill="#FFFFFF"/>
    <path d="M130,70 L70,8 L70,70 Z" fill="#FFFFFF" opacity="0.45"/>
    <path d="M10,70 L70,132 L130,70 L70,70 Z" fill="#C9A84C"/>
    <line x1="70" y1="8" x2="70" y2="70" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- ── TRIM GUIDES (outside safe zone — for reference, delete before send to printer) ── -->
  <!-- Safe zone boundary at 4mm from trim edge = 2mm bleed + 2mm safe = 4mm from SVG edge -->

  <!-- ── NAME BLOCK ── -->
  <!-- Positioned in bottom section: y ≈ 35–53mm (safe zone ends at 54mm) -->

  <!-- Name EN  7.5pt = 2.65mm font-size -->
  <text x="5" y="37.5"
    font-family="Raleway,Arial,sans-serif"
    font-weight="700"
    font-size="2.65"
    fill="#FFFFFF"
    letter-spacing="0.02">[Your Name]</text>

  <!-- Name AR  6pt = 2.12mm -->
  <text x="84" y="40.8"
    font-family="Cairo,Arial,sans-serif"
    font-weight="600"
    font-size="2.12"
    fill="rgba(255,255,255,0.68)"
    text-anchor="end"
    direction="rtl">[اسمك]</text>

  <!-- Title  4.8pt = 1.7mm -->
  <text x="5" y="43.8"
    font-family="Raleway,Arial,sans-serif"
    font-weight="500"
    font-size="1.7"
    fill="rgba(255,255,255,0.50)"
    letter-spacing="0.5"
    text-transform="uppercase">GENERAL MANAGER  ·  المدير العام</text>

  <!-- Gold divider -->
  <rect x="5" y="46" width="79" height="0.3" fill="#C9A84C" opacity="0.5"/>

  <!-- Contact  5.2pt = 1.84mm, line-height ~3.2mm -->
  <text x="5" y="49"
    font-family="Raleway,Arial,sans-serif"
    font-weight="400"
    font-size="1.84"
    fill="rgba(255,255,255,0.52)">+966 5X XXX XXXX</text>

  <text x="5" y="52"
    font-family="Raleway,Arial,sans-serif"
    font-weight="400"
    font-size="1.84"
    fill="rgba(255,255,255,0.52)">name@alinayamedical.com</text>

  <text x="5" y="55"
    font-family="Raleway,Arial,sans-serif"
    font-weight="400"
    font-size="1.84"
    fill="rgba(255,255,255,0.52)">alinayamedical.com</text>

</svg>
